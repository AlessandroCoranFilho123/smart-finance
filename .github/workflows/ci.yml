name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-e-testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar e compilar
        run: dotnet build SmartFinance.slnx -c Release

      - name: Testes de negócio e dados
        run: dotnet test tests/SmartFinance.Tests -c Release --no-build

      - name: Testes de interface (UIA — sessão interativa do runner)
        run: dotnet test tests/SmartFinance.GuiTests -c Release --no-build --filter "FullyQualifiedName!~CamposDeData & FullyQualifiedName!~Navegacao_Alcancar

      - name: Log do aplicativo (diagnóstico)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$env:APPDATA\SmartFinance\erro.log") { Get-Content "$env:APPDATA\SmartFinance\erro.log" -Raw } else { Write-Output "sem erro.log" }
